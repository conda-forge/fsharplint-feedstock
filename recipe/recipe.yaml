context:
  version: "0.27.2"

package:
  name: fsharplint
  version: ${{ version }}

source:
  - git: https://github.com/fsprojects/fsharplint
    tag: v${{ version }}
  - url: https://github.com/fsprojects/FSharpLint/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 62b83d9ad8441411c2ee115573c8bdb24b5bb2d84d01e43ad5a58287b25b71b1
    target_directory: archive

build:
  noarch: generic
  number: 0

requirements:
  build:
    - paket
    - dotnet
    - nuget-license
    - sed
  run:
    - dotnet

tests:
  - script:
      - dotnet-fsharplint --help

about:
  homepage: https://github.com/fsprojects/fsharplint
  license: MIT
  license_file: LICENSE
  summary: Lint tool for F#
  repository: https://github.com/fsprojects/fsharplint

extra:
  recipe-maintainers:
    - danielnachun
